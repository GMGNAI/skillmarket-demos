   字体系统
   ------------------------------------------------------------------
   英文用 Inter —— 实测 mobbin.com 的声明就是
   `font-family:Inter,Inter Placeholder,sans-serif`，为保持一致本地内置
   可变字重版（不走 CDN，离线可用）。

   中文用 PingFang SC 打头的系统栈。**Inter 排在最前面**是关键：
   CSS 按字形逐个回退，拉丁字母与数字命中 Inter，汉字在 Inter 里不存在、
   自然落到后面的中文字体 —— 一条 font-family 同时管好两套文字。

   neo-grotesque 骨架是同一类调性；HarmonyOS Sans SC / 思源黑体 作为
   非 macOS 的等价替补，Microsoft YaHei 兜底。

:root{
  /* GMGN 官方品牌 token —— 只给字标和 logo 用，不参与界面配色 */
  --font-brand:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gmgn-green:#9ED455;    /* 官方 primary green，规范里字标专用色 */
  --font-latin:'Inter Var','Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',
               'Segoe UI',Roboto,Helvetica,Arial;
  --font-cjk:'PingFang SC','HarmonyOS Sans SC','Source Han Sans SC','Noto Sans SC',
             'Hiragino Sans GB','Microsoft YaHei UI','Microsoft YaHei','WenQuanYi Micro Hei';
  --font:var(--font-latin),var(--font-cjk),sans-serif;
  --mono:'SF Mono',ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono','Roboto Mono',
         var(--font-cjk),monospace;
}

body{
  font-feature-settings:'liga' 1,'calt' 1;
  font-variant-numeric:tabular-nums;
  text-rendering:optimizeLegibility;
}

/* 中文不吃负字距 —— 汉字本身就是等宽方块，收紧会糊成一片；
   行高也要比拉丁文松，否则上下笔画会撞。 */
:root[lang="zh-CN"] body,
:root:not([lang]) body{line-height:1.72;}
:root[lang="zh-CN"] h1,:root[lang="zh-CN"] h2,:root[lang="zh-CN"] h3,
:root[lang="zh-CN"] .hero h1,:root[lang="zh-CN"] .big-score{letter-spacing:0;}
:root[lang="zh-CN"] .md{line-height:1.85;}

/* 英文模式：可以收紧字距、行高稍紧，这是 Inter 的最佳状态 */
:root[lang="en"] body{line-height:1.58;letter-spacing:-.003em;}
:root[lang="en"] .hero h1{letter-spacing:-.035em;}
:root[lang="en"] h1,:root[lang="en"] h2,:root[lang="en"] .card-title,
:root[lang="en"] .brand-text{letter-spacing:-.018em;}
:root[lang="en"] .md{line-height:1.68;}
/* 全大写小标签在英文下要放开字距，否则字母黏一起 */
:root[lang="en"] .metric i,:root[lang="en"] .tk-stat i,
:root[lang="en"] .tk-chg i,:root[lang="en"] th{letter-spacing:.075em;}

/* 数字一律等宽，表格与指标才对得齐 */
.num,.mono,td,th,.metric b,.tk-stat b,.tk-chg b,.big-score,.vbar-num,.comp-num,
.pct,.fig dd{font-variant-numeric:tabular-nums;}

/* ══════════════════════════════════════════════════════════════════
   MemeX Agent — 设计 token 直接对齐 gmgn.ai 线上暗色主题
   （--color-bg 18/18/18、--color-card 23/23/23、涨绿 70 184 125、
     跌红 222 87 89、主色 105 207 141 …… 均取自线上 CSS 变量）
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* ── 间距节奏：Mobbin 那种克制感很大程度来自间距守纪律，不是靠装饰 ── */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* ── 圆角与描边：发丝级描边 + 中等圆角，默认不给阴影 ── */
  --r-xs:6px; --r-sm:8px; --r:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
  --hair:1px;

  --ease:cubic-bezier(.22,.61,.36,1);
  --fast:.14s var(--ease); --mid:.22s var(--ease); --slow:.4s var(--ease);
  --rail-w:56px; --dock-w:352px; --top-h:56px;


  /* ══════════ 深色（默认，交易场景）══════════
     中性色带一点冷偏，避免纯灰的"没调过"感；层级用亮度差而不是描边粗细拉开 */
  --bg:#0F1011;
  --bg-deep:#0A0B0C;
  --bg-gray:#222427;
  --card:#17181A;
  --card-2:#1D1F21;
  --card-3:#232528;
  --panel:#1D1F21;
  --input:#1B1D1F;
  --popup:#1F2124;
  --divider:#25272A;
  --line-2:#2F3236;
  --line-3:#3A3E43;

  --t1:#F2F3F4;
  --t2:#B9BDC2;
  --t3:#7C8288;
  --t4:#565B61;

  --green:#4FBE87;
  --green-bright:#6FD79A;
  --green-dim:rgba(79,190,135,.16);
  --green-faint:rgba(79,190,135,.07);
  --red:#E5605F;
  --red-bright:#F26B72;
  --red-dim:rgba(229,96,95,.16);
  --red-faint:rgba(229,96,95,.07);
  --yellow:#E8B04B;
  --yellow-dim:rgba(232,176,75,.16);
  --blue:#4C9DF5;
  --purple:#B57DF0;
  --bsc:#F0B90E;
  --primary:#6FD79A;

  --overlay:rgba(0,0,0,.62);
  --lift:0 1px 2px rgba(0,0,0,.30), 0 10px 28px rgba(0,0,0,.34);
  --lift-sm:0 1px 2px rgba(0,0,0,.26), 0 4px 12px rgba(0,0,0,.22);
  --ring:rgba(111,215,154,.22);
}

/* ══════════ 浅色 ══════════
   不是把深色反相 —— 语义色单独调过，保证在白底上仍然可读且不刺眼 */
:root[data-theme="light"]{
  /* 官方绿 #9ED455 是给深色画布定的（规范里的背景是 #0A0B0A），在 #FAFAFA
     白底上对比度只有 1.68:1，字标几乎看不见。同色系压暗到 4.89:1 才过 WCAG AA
     的 4.5:1。深色主题仍用官方原色（那儿是 10.89:1）。压暗一个 UI 里的品牌色
     是常规适配，跟「重画标记」不是一回事 —— 标记本身仍是官方原件、逐字节。 */
  --gmgn-green:#4E7A15;
  --bg:#FAFAFA;
  --bg-deep:#F2F3F4;
  --bg-gray:#EDEEF0;
  --card:#FFFFFF;
  --card-2:#FAFAFB;
  --card-3:#F4F5F6;
  --panel:#F4F5F6;
  --input:#FFFFFF;
  --popup:#FFFFFF;
  --divider:#E7E8EA;
  --line-2:#DDDFE2;
  --line-3:#C9CCD1;

  --t1:#101113;
  --t2:#4A4F55;
  --t3:#787E85;
  --t4:#A2A8AF;

  --green:#12855A;
  --green-bright:#0E9F63;
  --green-dim:rgba(14,159,99,.13);
  --green-faint:rgba(14,159,99,.06);
  --red:#C0392F;
  --red-bright:#D0402F;
  --red-dim:rgba(192,57,47,.12);
  --red-faint:rgba(192,57,47,.05);
  --yellow:#9A6B0F;
  --yellow-dim:rgba(154,107,15,.13);
  --blue:#1668D6;
  --purple:#7A44C4;
  --bsc:#B07C06;
  --primary:#0E9F63;

  --overlay:rgba(16,17,19,.34);
  --lift:0 1px 2px rgba(16,17,19,.05), 0 12px 28px rgba(16,17,19,.07);
  --lift-sm:0 1px 2px rgba(16,17,19,.05), 0 4px 12px rgba(16,17,19,.05);
  --ring:rgba(14,159,99,.20);
}

/* 兼容旧变量名 */
:root{--shadow:var(--lift);}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--t1);
  font-family:var(--font); font-size:13.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums; overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;}
a{color:var(--green-bright);text-decoration:none;}
a:hover{text-decoration:underline;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--t4);}

.hidden{display:none !important;}
.num{font-variant-numeric:tabular-nums;}
.up{color:var(--green);} .down{color:var(--red);}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}

/* ══════════════ 布局 ══════════════ */
.app{
  display:grid; height:100vh;
  grid-template-columns:var(--rail-w) 1fr var(--dock-w);
  grid-template-rows:var(--top-h) 1fr;
  grid-template-areas:"top top top" "rail stage dock";
}
@media (max-width:1180px){
  .app{grid-template-columns:var(--rail-w) 1fr;
       grid-template-areas:"top top" "rail stage";}
  .dock{display:none;}
}

/* ══════════════ 顶栏 ══════════════ */
.topbar{
  grid-area:top; display:flex; align-items:center; gap:12px;
  padding:0 14px; border-bottom:1px solid var(--divider);
  background:linear-gradient(180deg,var(--bg),var(--bg));
  position:relative; z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;padding-right:4px;}
.brand-mark{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--green-bright),#2e8759);
  color:var(--bg-deep); box-shadow:0 2px 10px rgba(105,207,141,.28);
}
.brand-text{font-size:14px;font-weight:650;letter-spacing:.2px;white-space:nowrap;}
.brand-text em{font-style:normal;color:var(--green-bright);}

.chain-pill{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:999px;background:var(--panel);border:1px solid var(--line-2);
  font-size:12px;font-weight:600;color:var(--t2);transition:border-color var(--fast);
}
.chain-pill:hover{border-color:var(--bsc);}
.chain-dot{width:7px;height:7px;border-radius:50%;background:var(--bsc);
  box-shadow:0 0 0 3px rgba(240,185,14,.14);}

.omnibox{
  flex:1;max-width:520px;position:relative;display:flex;align-items:center;
  height:32px;padding:0 10px;gap:8px;border-radius:10px;
  background:var(--input);border:1px solid var(--line-2);
  transition:border-color var(--mid),background var(--mid),box-shadow var(--mid);
}
.omnibox:focus-within{
  border-color:rgba(105,207,141,.55);background:var(--card);
  box-shadow:0 0 0 3px rgba(105,207,141,.10);
}
.omni-icon{color:var(--t3);flex:none;}
.omnibox input{flex:1;background:none;border:0;outline:none;font-size:12.5px;}
.omnibox input::placeholder{color:var(--t4);}
.omnibox kbd{
  font-size:10px;color:var(--t4);border:1px solid var(--line-2);
  border-radius:4px;padding:1px 5px;background:var(--card-2);
}

.status{margin-left:auto;display:flex;align-items:center;gap:7px;
  font-size:11.5px;color:var(--t3);white-space:nowrap;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--t4);
  transition:background var(--mid),box-shadow var(--mid);}
.status-dot.live{background:var(--green);box-shadow:0 0 0 3px var(--green-dim);
  animation:pulse 1.6s infinite;}
.status-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-dim);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ══════════════ 左侧导航 ══════════════ */
.rail{
  grid-area:rail;display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:10px 0;border-right:1px solid var(--divider);background:var(--bg);
}
.rail-spacer{flex:1;}
.rail-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--t4);position:relative;
  transition:color var(--fast),background var(--fast),transform var(--fast);
}
.rail-btn svg{width:19px;height:19px;}
.rail-btn:hover{color:var(--t2);background:var(--card-2);}
.rail-btn:active{transform:scale(.92);}
.rail-btn.active{color:var(--green-bright);background:var(--green-faint);}
.rail-btn.active::before{
  content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
  width:2.5px;height:16px;border-radius:0 3px 3px 0;background:var(--green-bright);
}

/* ══════════════ 主区 ══════════════ */
.stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;}
.stream{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 24px 8px;
  scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 6px),transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 6px),transparent 100%);
}
.stream>*{max-width:820px;margin-inline:auto;}

/* ── 首屏 ── */
.hero{position:relative;padding:46px 4px 22px;animation:rise .5s var(--ease) both;}
.hero-glow{
  position:absolute;inset:-40px -20% auto;height:220px;pointer-events:none;
  background:radial-gradient(50% 100% at 50% 0,rgba(105,207,141,.13),transparent 70%);
}
.hero h1{margin:0 0 8px;font-size:27px;font-weight:680;letter-spacing:-.4px;}
.hero p{margin:0 0 22px;color:var(--t3);font-size:13px;max-width:600px;}
.hero p b{color:var(--t2);font-weight:600;}
.hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
.hero-card{
  text-align:left;padding:13px 14px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--divider);
  transition:border-color var(--mid),background var(--mid),transform var(--mid);
}
.hero-card:hover{border-color:var(--line-3);background:var(--card-2);transform:translateY(-2px);}
.hero-card b{display:block;font-size:12.5px;font-weight:600;margin-bottom:3px;}
.hero-card span{font-size:11.5px;color:var(--t3);}

/* ── 消息 ── */
.msg{margin:0 0 18px;animation:rise .34s var(--ease) both;}
.msg-user{display:flex;justify-content:flex-end;}
.bubble{
  max-width:76%;padding:9px 13px;border-radius:14px 14px 4px 14px;
  background:var(--card-3);border:1px solid var(--line-2);
  font-size:13px;word-break:break-word;
}
.bubble .mono{color:var(--green-bright);}

.msg-agent{display:flex;gap:11px;}
.avatar{
  width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--card-3),var(--card-2));border:1px solid var(--line-2);
  color:var(--green-bright);margin-top:1px;
}
.avatar svg{width:14px;height:14px;}
.agent-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px;}

/* ── 思考链 ── */
.trace{
  border:1px solid var(--divider);border-radius:var(--r);background:var(--card);
  overflow:hidden;transition:border-color var(--mid);
}
.trace:hover{border-color:var(--line-2);}
.trace-head{
  display:flex;align-items:center;gap:8px;padding:8px 11px;width:100%;
  font-size:11.5px;color:var(--t3);transition:background var(--fast);
}
.trace-head:hover{background:var(--card-2);}
.trace-head .chev{margin-left:auto;transition:transform var(--mid);color:var(--t4);}
.trace.open .chev{transform:rotate(90deg);}
.trace-list{
  display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--slow);
}
.trace.open .trace-list{grid-template-rows:1fr;}
.trace-inner{overflow:hidden;}
.trace-item{
  display:flex;gap:9px;align-items:flex-start;padding:5px 12px 5px 13px;
  font-size:11.5px;color:var(--t3);animation:fade .3s var(--ease) both;
}
.trace-item:last-child{padding-bottom:10px;}
.trace .ico{width:13px;height:13px;flex:none;}
.trace-item .ico{margin-top:2px;}
.trace-head .ico{color:var(--green);}
.spin{
  width:11px;height:11px;margin:1px;border-radius:50%;
  border:1.6px solid var(--line-3);border-top-color:var(--green-bright);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.trace-item.ok .ico{color:var(--green);}
.trace-item.fail{color:var(--red);}
.trace-item.fail .ico{color:var(--red);}

/* ══════════════ 卡片通用 ══════════════ */
.card{
  border:1px solid var(--divider);border-radius:var(--r-lg);background:var(--card);
  overflow:hidden;animation:rise .38s var(--ease) both;
  transition:border-color var(--mid),transform var(--mid),box-shadow var(--mid);
}
.card:hover{border-color:var(--line-2);}
.card-head{
  display:flex;align-items:center;gap:9px;padding:11px 14px;
  border-bottom:1px solid var(--divider);
}
.card-title{font-size:12.5px;font-weight:620;letter-spacing:.1px;}
.card-sub{font-size:11px;color:var(--t3);}
.card-body{padding:12px 14px;}
.card-foot{padding:9px 14px;border-top:1px solid var(--divider);background:var(--card);}

@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ── 代币头卡 ── */
.tk{padding:14px;display:flex;flex-direction:column;gap:13px;}
.tk-top{display:flex;align-items:center;gap:11px;}
.tk-logo{
  width:40px;height:40px;border-radius:11px;object-fit:cover;flex:none;
  background:var(--card-3);border:1px solid var(--line-2);
}
.tk-id{min-width:0;flex:1;}
.tk-sym{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:660;}
.tk-name{font-size:11.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.tk-price{text-align:right;}
.tk-price b{font-size:16px;font-weight:660;display:block;}
.tk-price span{font-size:12px;font-weight:600;}

.tk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--divider);border-radius:var(--r);overflow:hidden;}
.tk-stat{background:var(--card-2);padding:8px 10px;}
.tk-stat i{display:block;font-style:normal;font-size:10.5px;color:var(--t4);
  margin-bottom:2px;}
.tk-stat b{font-size:12.5px;font-weight:600;}

.tk-changes{display:flex;gap:1px;background:var(--divider);border-radius:var(--r);
  overflow:hidden;}
.tk-chg{flex:1;background:var(--card-2);padding:7px 4px;text-align:center;}
.tk-chg i{display:block;font-style:normal;font-size:10px;color:var(--t4);}
.tk-chg b{font-size:12px;font-weight:620;}

.tk-links{display:flex;gap:6px;flex-wrap:wrap;}
.chip-link{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;
  border-radius:7px;background:var(--panel);border:1px solid var(--line-2);
  font-size:11px;color:var(--t2);transition:all var(--fast);
}
.chip-link:hover{background:var(--card-3);border-color:var(--line-3);color:var(--t1);
  text-decoration:none;transform:translateY(-1px);}

/* ── 技能卡 ── */
.score-ring{width:44px;height:44px;flex:none;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .track{stroke:var(--bg-gray);}
.score-ring .bar{stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease);}
.score-ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:680;
}
.verdict-line{font-size:12px;color:var(--t2);}

.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.metric{
  padding:6px 9px;border-radius:8px;background:var(--card-2);
  border:1px solid var(--divider);min-width:76px;
}
.metric i{display:block;font-style:normal;font-size:10px;color:var(--t4);}
.metric b{font-size:12px;font-weight:620;}
.metric.good b{color:var(--green);} .metric.bad b{color:var(--red);}
.metric.warn b{color:var(--yellow);}

.signals{display:flex;flex-direction:column;gap:2px;}
.sig{
  display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:7px;
  font-size:12px;transition:background var(--fast);animation:fade .3s var(--ease) both;
}
.sig:hover{background:var(--card-2);}
.sig-dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:6px;}
.sig.good .sig-dot{background:var(--green);box-shadow:0 0 0 3px var(--green-faint);}
.sig.warn .sig-dot{background:var(--yellow);box-shadow:0 0 0 3px rgba(248,185,81,.08);}
.sig.bad  .sig-dot{background:var(--red);box-shadow:0 0 0 3px var(--red-faint);}
.sig.info .sig-dot{background:var(--t4);}
.sig-text{flex:1;min-width:0;}
.sig-detail{display:block;font-size:11px;color:var(--t4);margin-top:1px;}
.sig.bad .sig-text{color:var(--red-bright);}

/* ── 前排热力网格 ── */
.eb-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-bottom:12px;}
.eb-cell{
  aspect-ratio:1;border-radius:3px;position:relative;cursor:default;
  transition:transform var(--fast),box-shadow var(--fast);
  animation:fade .4s var(--ease) both;
}
.eb-cell:hover{transform:scale(1.42);z-index:5;box-shadow:0 3px 10px rgba(0,0,0,.5);}
.eb-cell.hold{background:var(--red);}
.eb-cell.bought_more{background:var(--green-bright);}
.eb-cell.sold_part{background:var(--yellow);}
.eb-cell.sold{background:var(--bg-gray);}
.eb-cell.transfered{background:var(--purple);opacity:.55;}
.eb-cell.smart{box-shadow:0 0 0 1.5px var(--green-bright);}
.eb-cell.risky::after{
  content:"";position:absolute;right:-1px;top:-1px;width:4px;height:4px;
  border-radius:50%;background:var(--red);
}
.eb-legend{display:flex;flex-wrap:wrap;gap:11px;font-size:11px;color:var(--t3);}
.eb-legend span{display:flex;align-items:center;gap:5px;}
.eb-key{width:9px;height:9px;border-radius:2.5px;}

/* ── 构成条 ── */
.comp-row{display:flex;align-items:center;gap:9px;padding:4px 0;}
.comp-label{width:74px;font-size:11.5px;color:var(--t3);flex:none;}
.comp-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-gray);overflow:hidden;}
.comp-fill{height:100%;border-radius:4px;transform-origin:left;
  animation:grow .7s var(--ease) both;}
.comp-fill.good{background:linear-gradient(90deg,var(--green),var(--green-bright));}
.comp-fill.warn{background:linear-gradient(90deg,var(--yellow),var(--yellow));}
.comp-fill.bad{background:linear-gradient(90deg,var(--red),var(--red));}
.comp-fill.neutral{background:var(--line-3);}
.comp-num{width:44px;text-align:right;font-size:11.5px;font-weight:600;flex:none;}

/* ── 表格 ── */
.tbl-wrap{
  overflow-x:auto;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 14px),transparent);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 14px),transparent);
}
table.tbl{width:100%;border-collapse:collapse;font-size:11.5px;}
table.tbl th{
  text-align:left;font-weight:500;color:var(--t4);padding:6px 9px;
  border-bottom:1px solid var(--divider);white-space:nowrap;position:sticky;top:0;
  background:var(--card);font-size:10.5px;
}
table.tbl td{padding:6px 9px;border-bottom:1px solid var(--divider);white-space:nowrap;}
table.tbl tbody tr{transition:background var(--fast);}
table.tbl tbody tr:hover{background:var(--card-2);}
table.tbl tbody tr.clickable{cursor:pointer;}
.tag{
  display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;
  background:var(--panel);color:var(--t3);margin-right:3px;border:1px solid var(--divider);
}
.tag.good{color:var(--green);border-color:rgba(70,184,125,.3);background:var(--green-faint);}
.tag.bad{color:var(--red);border-color:rgba(222,87,89,.3);background:var(--red-faint);}
.tag.warn{color:var(--yellow);border-color:rgba(248,185,81,.3);background:rgba(248,185,81,.06);}

.tk-cell{display:flex;align-items:center;gap:7px;}
.tk-cell img{width:22px;height:22px;border-radius:6px;background:var(--card-3);flex:none;}
.tk-cell b{font-size:12px;font-weight:600;}
.tk-cell i{font-style:normal;font-size:10.5px;color:var(--t4);display:block;}

/* ── K 线 ── */
.chart-box{position:relative;height:220px;padding:4px 0 0;}
.chart-box canvas{width:100%;height:100%;display:block;}
.chart-tip{
  position:absolute;pointer-events:none;padding:6px 8px;border-radius:7px;
  background:var(--popup);border:1px solid var(--line-2);font-size:10.5px;
  box-shadow:var(--shadow);opacity:0;transition:opacity var(--fast);z-index:6;
  white-space:nowrap;line-height:1.6;
}
.chart-tip.on{opacity:1;}
.res-tabs{display:flex;gap:2px;margin-left:auto;}
.res-tab{
  padding:2px 7px;border-radius:6px;font-size:10.5px;color:var(--t4);
  transition:all var(--fast);
}
.res-tab:hover{color:var(--t2);background:var(--card-3);}
.res-tab.on{color:var(--green-bright);background:var(--green-faint);}

/* ── 综合结论 ── */
.verdict{
  border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden;
  border:1px solid var(--divider);background:var(--card);
}
.verdict::before{
  content:"";position:absolute;inset:0 0 auto;height:110px;pointer-events:none;
  background:radial-gradient(60% 100% at 20% 0,var(--vc,rgba(105,207,141,.11)),transparent 72%);
}
.verdict-top{display:flex;align-items:center;gap:14px;position:relative;}
.big-score{font-size:38px;font-weight:700;line-height:1;letter-spacing:-1px;}
.big-grade{font-size:12px;color:var(--t3);margin-top:3px;}
.verdict-action{
  font-size:14px;font-weight:640;margin-bottom:3px;
}
.verdict-meta{font-size:11.5px;color:var(--t3);}
.vbars{display:flex;flex-direction:column;gap:6px;margin-top:14px;position:relative;}
.vbar{display:flex;align-items:center;gap:9px;}
.vbar-label{width:112px;font-size:11.5px;color:var(--t3);flex:none;}
.vbar-track{flex:1;height:5px;border-radius:3px;background:var(--bg-gray);overflow:hidden;}
.vbar-fill{height:100%;border-radius:3px;transform-origin:left;
  animation:grow .8s var(--ease) both;}
.vbar-num{width:28px;text-align:right;font-size:11.5px;font-weight:620;flex:none;}

/* ── X 叙事 ── */
.tweet{
  display:flex;gap:9px;padding:9px 10px;border-radius:var(--r);
  background:var(--card-2);border:1px solid var(--divider);margin-bottom:7px;
  transition:border-color var(--fast),background var(--fast);
  animation:rise .34s var(--ease) both;
}
.tweet:hover{border-color:var(--line-2);background:var(--card-3);}
.tweet img.av{width:26px;height:26px;border-radius:50%;flex:none;background:var(--card-3);}
.tweet-main{min-width:0;flex:1;}
.tweet-head{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:2px;}
.tweet-head b{font-weight:620;}
.tweet-head span{color:var(--t4);}
.tweet-text{font-size:12px;color:var(--t2);word-break:break-word;white-space:pre-wrap;}
.tweet-eng{display:flex;gap:13px;margin-top:5px;font-size:10.5px;color:var(--t4);}
.verified{width:12px;height:12px;color:var(--blue);flex:none;}
.narr-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.narr{
  padding:3px 9px;border-radius:999px;font-size:11px;
  background:linear-gradient(135deg,rgba(105,207,141,.13),rgba(21,143,255,.10));
  border:1px solid rgba(105,207,141,.22);color:var(--t2);
}

/* ── Markdown 正文 ── */
.md{font-size:13px;color:var(--t2);line-height:1.72;}
.md h2{font-size:15.5px;font-weight:660;color:var(--t1);margin:2px 0 9px;
  letter-spacing:-.2px;}
.md h3{font-size:13.5px;font-weight:640;color:var(--t1);margin:14px 0 7px;}
.md p{margin:0 0 9px;}
.md ul{margin:0 0 10px;padding-left:17px;}
.md li{margin:2px 0;}
.md b,.md strong{color:var(--t1);font-weight:620;}
.md code{
  background:var(--panel);padding:1.5px 5px;border-radius:5px;font-size:11.5px;
  font-family:ui-monospace,Menlo,monospace;color:var(--green-bright);
}
.md blockquote{
  margin:0 0 11px;padding:9px 12px;border-left:2.5px solid var(--green-bright);
  background:var(--green-faint);border-radius:0 var(--r-sm) var(--r-sm) 0;
  color:var(--t1);font-size:12.5px;
}
.md hr{border:0;border-top:1px solid var(--divider);margin:13px 0;}
.md em{color:var(--t4);font-style:normal;font-size:11.5px;}
.caret::after{
  content:"";display:inline-block;width:6px;height:13px;margin-left:2px;
  background:var(--green-bright);vertical-align:-2px;animation:blink .9s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

/* ══════════════ 输入区 ══════════════ */
.composer-wrap{
  padding:6px 24px 12px;border-top:1px solid var(--divider);
  background:linear-gradient(180deg,var(--bg),var(--bg));
}
.composer-wrap>*{max-width:820px;margin-inline:auto;}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:7px 0;min-height:20px;}
.chip{
  padding:4px 11px;border-radius:999px;font-size:11.5px;color:var(--t2);
  background:var(--card);border:1px solid var(--divider);
  transition:all var(--fast);animation:rise .3s var(--ease) both;
}
.chip:hover{border-color:rgba(105,207,141,.45);color:var(--t1);
  background:var(--green-faint);transform:translateY(-1px);}
.composer{
  display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;
  border-radius:var(--r-lg);background:var(--input);border:1px solid var(--line-2);
  transition:border-color var(--mid),box-shadow var(--mid),background var(--mid);
}
.composer:focus-within{
  border-color:rgba(105,207,141,.5);background:var(--card);
  box-shadow:0 0 0 3px rgba(105,207,141,.09);
}
.composer textarea{
  flex:1;background:none;border:0;outline:none;resize:none;font-size:13px;
  line-height:1.6;max-height:132px;padding:5px 0;
}
.composer textarea::placeholder{color:var(--t4);}
.send{
  width:31px;height:31px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--green-bright);color:#111;
  transition:transform var(--fast),opacity var(--fast),background var(--fast);
}
.send:hover{background:var(--green);}
.send:active{transform:scale(.9);}
.send:disabled{opacity:.32;cursor:not-allowed;background:var(--line-3);color:var(--t3);}
.disclaimer{padding-top:7px;font-size:10.5px;color:var(--t4);text-align:center;}

/* ══════════════ 右侧 dock ══════════════ */
.dock{
  grid-area:dock;border-left:1px solid var(--divider);background:var(--bg);
  display:flex;flex-direction:column;min-height:0;
}
.dock-tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--divider);}
.dock-tab{
  padding:5px 11px;border-radius:8px;font-size:11.5px;color:var(--t4);
  transition:all var(--fast);
}
.dock-tab:hover{color:var(--t2);background:var(--card-2);}
.dock-tab.active{color:var(--t1);background:var(--card-3);}
.dock-body{
  flex:1;overflow-y:auto;padding:11px 10px 16px;min-height:0;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 8px),transparent);
          mask-image:linear-gradient(180deg,transparent,#000 12px,#000 calc(100% - 8px),transparent);
}
.dock-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;height:220px;color:var(--t4);font-size:11.5px;text-align:center;
}
.dock-sec{margin-bottom:13px;animation:rise .35s var(--ease) both;}
.dock-sec-title{
  font-size:10.5px;color:var(--t4);margin-bottom:7px;letter-spacing:.4px;
  text-transform:uppercase;display:flex;align-items:center;gap:6px;
}
.dock-sec-title::after{content:"";flex:1;height:1px;background:var(--divider);}

.kol-row{
  display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:9px;
  transition:background var(--fast);
}
.kol-row:hover{background:var(--card-2);}
.kol-row img{width:24px;height:24px;border-radius:50%;background:var(--card-3);flex:none;}
.kol-row .k-main{flex:1;min-width:0;}
.kol-row b{font-size:11.5px;font-weight:600;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.kol-row i{font-style:normal;font-size:10px;color:var(--t4);}
.dot-state{width:6px;height:6px;border-radius:50%;flex:none;}
.dot-state.ok{background:var(--green);}
.dot-state.wait{background:var(--yellow);animation:pulse 1.6s infinite;}
.dot-state.bad{background:var(--t4);}

/* ══════════════ 弹层 ══════════════ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:100;animation:fade .2s var(--ease);
}
.modal{
  width:min(460px,92vw);max-height:80vh;overflow-y:auto;border-radius:var(--r-lg);
  background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);
  animation:rise .28s var(--ease) both;
}
.modal-head{display:flex;align-items:center;padding:13px 15px;
  border-bottom:1px solid var(--divider);font-size:13px;font-weight:620;}
.modal-body{padding:14px 15px;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:11px 15px;
  border-top:1px solid var(--divider);}
.btn{
  padding:6px 14px;border-radius:9px;font-size:12px;background:var(--panel);
  border:1px solid var(--line-2);transition:all var(--fast);
}
.btn:hover{background:var(--card-3);border-color:var(--line-3);}
.btn.primary{background:var(--green-bright);color:#111;border-color:transparent;
  font-weight:600;}
.btn.primary:hover{background:var(--green);}
.ta{
  width:100%;min-height:190px;background:var(--input);border:1px solid var(--line-2);
  border-radius:var(--r);padding:10px;font-size:12px;resize:vertical;outline:none;
  font-family:ui-monospace,Menlo,monospace;line-height:1.8;
}
.ta:focus{border-color:rgba(105,207,141,.45);}
.hint{font-size:11px;color:var(--t4);margin-top:9px;line-height:1.7;}

/* ══════════════ X 叙事分区 ══════════════ */
.sec-head{
  display:flex;align-items:center;gap:8px;margin:14px 0 8px;
  font-size:11px;color:var(--t3);font-weight:600;
}
.sec-head::after{content:"";flex:1;height:1px;background:var(--divider);}
.sec-head i{font-style:normal;font-weight:400;color:var(--t4);font-size:10.5px;order:3;}
.sec-head span{flex:none;}

.kol-strip{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:9px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 16px),transparent);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 16px),transparent);
}
.kol-pill{
  display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;flex:none;
  border-radius:999px;background:var(--card-2);border:1px solid var(--divider);
  transition:border-color var(--fast),transform var(--fast);
  animation:rise .3s var(--ease) both;
}
.kol-pill:hover{border-color:rgba(105,207,141,.4);transform:translateY(-1px);}
.kol-pill img{width:22px;height:22px;border-radius:50%;background:var(--card-3);flex:none;}
.kol-pill b{display:block;font-size:11px;font-weight:600;}
.kol-pill i{display:block;font-style:normal;font-size:10px;color:var(--green);}

.w2-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:6px;
  border-radius:var(--r);background:var(--card-2);border:1px solid var(--divider);
  transition:all var(--fast);animation:rise .3s var(--ease) both;
}
.w2-item:hover{border-color:rgba(105,207,141,.4);background:var(--card-3);text-decoration:none;
  transform:translateY(-1px);}
.w2-ico{font-size:17px;flex:none;line-height:1;}
.w2-main{flex:1;min-width:0;}
.w2-main b{display:block;font-size:11.5px;font-weight:620;color:var(--t1);}
.w2-main span{display:block;font-size:11px;color:var(--t3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.w2-item>i{font-style:normal;font-size:10.5px;color:var(--t4);flex:none;}

.w2-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.w2-chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:10.5px;background:var(--panel);border:1px solid var(--line-2);color:var(--t2);
  transition:all var(--fast);
}
.w2-chip:hover{border-color:rgba(105,207,141,.45);text-decoration:none;color:var(--t1);}

/* ── 时效标记 ── */
.heat{
  font-size:9.5px;padding:1px 5px;border-radius:4px;font-weight:600;flex:none;
}
.heat.hot{color:#111;background:var(--green-bright);}
.heat.old{color:var(--t4);background:var(--bg-gray);}
.kol-pill.hard{border-color:rgba(105,207,141,.42);}

/* ── 折叠区（疑似 / 历史提及）── */
.fold{
  border:1px solid var(--divider);border-radius:var(--r);background:var(--card);
  margin:10px 0 6px;overflow:hidden;transition:border-color var(--fast);
}
.fold:hover{border-color:var(--line-2);}
.fold-head{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;
  font-size:11.5px;color:var(--t3);transition:background var(--fast);
}
.fold-head:hover{background:var(--card-2);}
.fold-head i{font-style:normal;font-size:10.5px;color:var(--t4);}
.fold-head .chev{margin-left:auto;transition:transform var(--mid);color:var(--t4);}
.fold.open .chev{transform:rotate(90deg);}
.fold-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--slow);}
.fold.open .fold-body{grid-template-rows:1fr;}
.fold-inner{overflow:hidden;}
.fold-inner>.tweet{margin:0 9px 7px;}
.fold-inner>.tweet:first-child{margin-top:2px;}

.tweet-eng .eng{color:var(--green);font-weight:620;}

/* ══════════════ Binance Alpha 徽章 ══════════════ */
.alpha{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;
  font-size:10.5px;font-weight:650;white-space:nowrap;line-height:1.5;
  background:rgba(240,185,14,.12);color:var(--bsc);
  border:1px solid rgba(240,185,14,.32);
}
.alpha.fresh{
  background:linear-gradient(135deg,rgba(240,185,14,.24),rgba(240,185,14,.10));
  color:#ffd75e;border-color:rgba(240,185,14,.55);
  box-shadow:0 0 0 2px rgba(240,185,14,.07);
}
.alpha.dead{
  background:var(--red-faint);color:var(--red);border-color:rgba(222,87,89,.34);
}
.tk-sym .alpha{margin-left:2px;}

/* ══════════════ 设置面板表单 ══════════════ */
.note-box{
  padding:11px 13px;border-radius:var(--r);background:var(--green-faint);
  border:1px solid rgba(105,207,141,.22);font-size:11.5px;line-height:1.75;
  color:var(--t2);margin-bottom:14px;
}
.note-box b{color:var(--t1);}
.note-box code{background:var(--panel);padding:1px 4px;border-radius:3px;font-size:10.5px;}
.note-box.warn{background:rgba(248,185,81,.08);border-color:rgba(248,185,81,.26);}

.frow{
  display:flex;align-items:center;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--card-2);
}
.frow:last-of-type{border-bottom:0;}
.frow>label:first-child{
  width:110px;flex:none;font-size:12px;color:var(--t2);line-height:1.4;
}
.frow>label:first-child i{
  display:block;font-style:normal;font-size:10.5px;color:var(--t4);margin-top:2px;
}
.frow input[type=text],.frow input[type=password],.frow input[type=number],
.frow input:not([type]),.frow select{
  flex:1;min-width:0;height:30px;padding:0 10px;border-radius:8px;
  background:var(--input);border:1px solid var(--line-2);color:var(--t1);
  font-size:12px;outline:none;transition:border-color var(--fast);
}
.frow input:focus,.frow select:focus{border-color:rgba(105,207,141,.5);}
.frow input::placeholder{color:var(--t4);}
.frow select{cursor:pointer;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),
    linear-gradient(135deg,var(--t3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

/* 开关 */
.sw{position:relative;flex:none;width:38px;height:21px;cursor:pointer;}
.sw input{position:absolute;opacity:0;width:0;height:0;}
.sw span{
  position:absolute;inset:0;border-radius:999px;background:var(--bg-gray);
  border:1px solid var(--line-2);transition:background var(--mid),border-color var(--mid);
}
.sw span::after{
  content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;
  background:var(--t3);transition:transform var(--mid),background var(--mid);
}
.sw input:checked + span{background:var(--green-dim);border-color:rgba(105,207,141,.5);}
.sw input:checked + span::after{transform:translateX(17px);background:var(--green-bright);}
.sw input:focus-visible + span{box-shadow:0 0 0 3px rgba(105,207,141,.18);}

/* ══════════════ 嵌入模式（Chrome 扩展悬浮窗）══════════════
   悬浮窗自带标题栏，所以收掉品牌与状态；左侧栏压窄，右侧 dock 让位。 */
body.embed .brand,
body.embed .status{display:none;}
body.embed .topbar{height:44px;padding:0 10px;gap:8px;}
body.embed .omnibox{max-width:none;}
body.embed .app{--top-h:44px;--rail-w:44px;}
body.embed .rail{padding:8px 0;}
body.embed .rail-btn{width:30px;height:30px;}
body.embed .rail-btn svg{width:17px;height:17px;}
body.embed .rail-btn.active::before{left:-7px;height:14px;}
body.embed .stream{padding:14px 14px 6px;}
body.embed .composer-wrap{padding:4px 14px 8px;}
body.embed .hero{padding:26px 2px 14px;}
body.embed .hero h1{font-size:21px;}
body.embed .hero p{font-size:12px;margin-bottom:16px;}
body.embed .disclaimer{display:none;}

/* 窄栏：悬浮窗默认宽度下 dock 收起、卡片更紧凑 */
@media (max-width:1080px){
  .dock{display:none;}
  .app{grid-template-columns:var(--rail-w) 1fr;
       grid-template-areas:"top top" "rail stage";}
}
body.compact .dock{display:none;}
body.compact .app{grid-template-columns:var(--rail-w) 1fr;
  grid-template-areas:"top top" "rail stage";}

@media (max-width:720px){
  .hero-grid{grid-template-columns:1fr;}
  .tk-stats{grid-template-columns:repeat(2,1fr);}
  .eb-grid{grid-template-columns:repeat(10,1fr);}
  .metrics .metric{min-width:64px;}
  .stream>*{max-width:none;}
  .wrow .name,.vbar-label{width:88px;font-size:11px;}
  .comp-label{width:60px;}
}
@media (max-width:480px){
  .eb-grid{grid-template-columns:repeat(7,1fr);}
  .tk-changes{flex-wrap:wrap;}
  .tk-chg{min-width:33%;}
}

/* ══════════════════════════════════════════════════════════════════
   精修层 —— 参考 Mobbin 的工艺：发丝描边、默认无阴影、悬停微抬升、
   分段控件、小号字距标签。放在最后，用来覆盖前面的老写法。
   ══════════════════════════════════════════════════════════════════ */

/* ── 卡片：默认干净，只在悬停时抬起来 ── */
.card{
  border:var(--hair) solid var(--divider);
  border-radius:var(--r-lg);
  box-shadow:none;
  transition:border-color var(--mid), transform var(--mid), box-shadow var(--mid);
}
.card:hover{
  border-color:var(--line-2);
  transform:translateY(-1px);
  box-shadow:var(--lift-sm);
}
.card-head{padding:var(--s3) var(--s4);}
.card-body{padding:var(--s3) var(--s4) var(--s4);}
.card-foot{padding:var(--s3) var(--s4);background:var(--card-2);}

/* ── 小号标签统一字距：metric / stat / 表头 ── */
.metric i,.tk-stat i,.tk-chg i,.fig dt,th,.dock-sec-title,.sec-head span{
  letter-spacing:.055em;
}
.metric i,.tk-stat i,.tk-chg i{text-transform:uppercase;font-size:9.5px;}
th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;}

/* ── 指标块：去掉描边靠底色分层 ── */
.metric{
  background:var(--card-2);border-color:transparent;border-radius:var(--r);
  padding:var(--s2) 10px;
}
.tk-stats,.tk-changes{background:var(--divider);border-radius:var(--r);}
.tk-stat,.tk-chg{background:var(--card-2);}

/* ── 分段控件：dock tabs / K线粒度 / 设置 tab 共用一条轨道 ── */
.dock-tabs{
  gap:2px;padding:var(--s2) 10px;background:none;
}
.dock-tab{
  border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:560;
  color:var(--t3);transition:color var(--fast),background var(--fast);
}
.dock-tab:hover{background:var(--card-2);color:var(--t2);}
.dock-tab.active{background:var(--card-3);color:var(--t1);}
.res-tabs{gap:2px;padding:2px;background:var(--card-2);border-radius:var(--r-pill);}
.res-tab{border-radius:var(--r-pill);padding:3px 9px;font-weight:560;}
.res-tab.on{background:var(--card);color:var(--t1);box-shadow:var(--lift-sm);}

/* ── 药丸：chips / tags / links 统一形状 ── */
.chip,.chip-link,.narr,.w2-chip{border-radius:var(--r-pill);}
.chip{padding:5px 13px;font-size:12px;}
.chip:hover{transform:none;border-color:var(--line-3);background:var(--card-2);
  color:var(--t1);}
.chip-link{height:26px;border-radius:var(--r-pill);}
.chip-link:hover{transform:none;background:var(--card-3);}
.tag{border-radius:var(--r-xs);padding:2px 6px;font-weight:560;}

/* ── 左侧栏：更宽、图标更大、选中态用底色而不是左侧竖条 ── */
.rail{gap:var(--s1);padding:var(--s3) 0;background:var(--bg);
  border-right:var(--hair) solid var(--divider);}
.rail-btn{width:38px;height:38px;border-radius:var(--r);}
.rail-btn svg{width:20px;height:20px;}
.rail-btn:active{transform:none;}
.rail-btn.active{background:var(--card-3);color:var(--t1);}
.rail-btn.active::before{display:none;}
.rail-btn:hover{background:var(--card-2);}

/* ── 顶栏：更高、更透气 ── */
.topbar{
  padding:0 var(--s4);gap:var(--s3);background:var(--bg);
  border-bottom:var(--hair) solid var(--divider);
}
.brand-mark{width:28px;height:28px;border-radius:var(--r-sm);box-shadow:none;}
.brand-text{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
.brand-text em{color:var(--green-bright);font-weight:700;}
.chain-pill{height:30px;border-radius:var(--r-pill);background:var(--card-2);
  border-color:var(--divider);}
.omnibox{height:36px;border-radius:var(--r);background:var(--card-2);
  border-color:var(--divider);}
.omnibox:focus-within{background:var(--card);border-color:var(--line-3);
  box-shadow:0 0 0 3px var(--ring);}
.omnibox kbd{background:var(--card-3);border-color:var(--divider);}

/* ── 主题切换 ── */
.theme-btn{
  width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;

   16x16 像素蛙，两条都犯了，已删除。内联而不是引用文件，是为了让
   tools/build_demo_page.py 产出的单文件 demo 也能显示，且不额外发一个请求。

/* ══════════════ 品牌字标 ══════════════
   方案 01「挤压重字」：Inter 900 + 负字距，X 放大 1.28 倍并咬进前一个 e。
   顶栏尺寸下不带价格折线 —— 19px 上那条线只会变成噪点，
   折线只在 hero 的大尺寸锁版里出现。 */
.brand{
  display:flex;align-items:baseline;gap:7px;padding-right:2px;
  text-decoration:none;color:inherit;flex:none;
}
.brand:hover{text-decoration:none;}
.wordmark{
  font-family:var(--font-latin),sans-serif;
  font-weight:900;font-size:19px;letter-spacing:-.055em;line-height:1;
  color:var(--t1);white-space:nowrap;
}
.wordmark em{
  font-style:normal;font-weight:900;font-size:1.28em;
  color:var(--green-bright);letter-spacing:-.06em;
  margin-left:-.04em;          /* 咬进前一个字母 */
}
/* 顶栏锁版：折线垫在字标底下，跟 hero 一个语言。
   折线用 stroke 描的纯几何，不吃字体 —— 扩展挂在别人页面上也不会走形。 */
.brand-lockup{position:relative;display:inline-flex;align-items:baseline;}
.brand-line{
  position:absolute;left:-8%;top:50%;width:116%;height:158%;
  /* 偏下穿过字腰（hero 也是这么排的）—— 压在字中间会把小字号搞糊 */
  transform:translateY(-44%);
  stroke:var(--bsc);opacity:.92;pointer-events:none;z-index:0;
}
.brand-lockup .wordmark{position:relative;z-index:1;}
.brand:hover .brand-line{opacity:1;transition:opacity var(--fast);}

.brand-sub{
  font-family:var(--font-latin),sans-serif;
  font-size:11.5px;font-weight:560;letter-spacing:.01em;color:var(--t3);
  line-height:1;
}
.brand:hover .wordmark em{color:var(--green);transition:color var(--fast);}
body.embed .wordmark{font-size:16px;}
body.embed .brand-sub{display:none;}

/* hero 里的完整锁版：带价格折线 */
.hero-lockup{display:block;margin:0 0 20px;width:min(290px,72%);height:auto;}
.hero-lockup .wm-ink{fill:var(--t1);}
.hero-lockup .wm-x{fill:var(--green-bright);}
.hero-lockup .wm-line{stroke:var(--bsc);}

/* ══════════════ hero 字标入场动效 ══════════════
   帧率要点：
   · 折线用 stroke-dashoffset 描出 —— 这是唯一能让笔尖沿路径走的属性。
     它走 paint 不走合成，但这条线只有 ~300 单位长、单条 polyline，
     每帧重绘代价可以忽略；换成 clip 位移虽然能上合成层，
     但拐角处会露馅（线是锯齿状的，矩形揭示会同时露出两段）。
   · 笔尖光点用 offset-distance 驱动 —— 这个属性走 transform 合成，
     整条动画里最"贵"的视觉元素反而是零主线程成本的。
   · 字标只动 transform 和 opacity，两者都在合成层。
   · 全程不碰 width/height/top/left，不触发任何重排。
   路径长度由 JS 用 getTotalLength() 量一次写进 --len，不做每帧计算。 */
.hero-lockup .wm-line{
  stroke-dasharray:var(--len,340);
  stroke-dashoffset:var(--len,340);
}
.hero-lockup .wm-tip{
  fill:var(--bsc);opacity:0;
  offset-path:path("M24,74 L62,60 L96,68 L136,46 L178,62 L218,40 L258,54 L308,26");
  offset-distance:0%;
  filter:drop-shadow(0 0 5px rgba(240,185,14,.55));
}
.hero-lockup text{
  opacity:0;transform:translateY(7px);transform-origin:50% 50%;
}

.hero-lockup.play .wm-line{
  animation:wmDraw 900ms cubic-bezier(.32,.72,.24,1) 120ms forwards;
}
.hero-lockup.play .wm-tip{
  animation:wmTip 900ms cubic-bezier(.32,.72,.24,1) 120ms forwards;
}
.hero-lockup.play text{
  animation:wmRise 620ms cubic-bezier(.22,.9,.3,1) 260ms forwards;
}
@keyframes wmDraw{ to{stroke-dashoffset:0;} }
@keyframes wmTip{
  0%  {offset-distance:0%;   opacity:0;}
  12% {opacity:1;}
  86% {opacity:1;}
  100%{offset-distance:100%; opacity:0;}
}
@keyframes wmRise{
  0%  {opacity:0; transform:translateY(7px);}
  100%{opacity:1; transform:translateY(0);}
}
/* 动画 forwards 会保留终态；这条是动画被禁用时的兜底 */
.no-anim .hero-lockup text{opacity:1;transform:none;}

/* offset-path 不支持时把光点彻底藏掉，避免它钉在原点 */
@supports not (offset-path: path("M0,0 L1,1")){
  .hero-lockup .wm-tip{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .hero-lockup .wm-line{stroke-dashoffset:0;animation:none!important;}
  .hero-lockup .wm-tip{display:none;}
  .hero-lockup text{opacity:1!important;transform:none!important;}
  .hero-lockup.play text{animation:none!important;}
}

/* 设置里的「各项数据走哪一路」—— 三列：端点名 / 来源 / 回落原因 */
.trace-row{display:grid;grid-template-columns:8.5rem 5.5rem 1fr;gap:10px;
  align-items:baseline;padding:5px 0;border-bottom:1px solid var(--divider);
  font-size:12px;}
.trace-row:last-child{border-bottom:0;}

.trace-row i{font-style:normal;color:var(--t4);}

/* GMGN Key 的绑定状态条 —— 重开面板一眼能看出「已经绑过了」。
   之前掩码 key 只在输入框的 placeholder 里，看着跟没绑一样，
   用户每次都重新填一遍、再点一次「测试连接」白耗配额。

.bind-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;

  border:1px solid var(--line-2);background:var(--card-2);font-size:12.5px;}

.bind-row code{font-family:ui-monospace,Menlo,monospace;font-size:12px;
  padding:2px 7px;border-radius:6px;background:var(--input);color:var(--t2);}
.bind-row i{font-style:normal;color:var(--t4);flex:1 1 auto;min-width:9rem;}
.bind-row.on{border-color:color-mix(in oklab,var(--green) 42%,var(--line-2));
  background:var(--green-faint);}
.bind-row.on b{color:var(--green);}
.bind-row.bad{border-color:color-mix(in oklab,var(--red) 42%,var(--line-2));}
.bind-row.bad b{color:var(--red);}
.bind-row.off b{color:var(--t3);}
.act.sm{padding:4px 11px;font-size:12px;line-height:1.5;}

var missing = Object.create(null);
var debug = /[?&]i18n-debug=1/.test(location.search);

/* 列表型捕获的处理：像「叙事归类：币安概念 / 交易所 / CEX / AI / 科技」这样，
   整串不在词典里，但每一项都在。不能简单按 ' / ' 切 —— 分类名本身就含
   ' / '（「交易所 / CEX」），切了就碎。所以改成**按最长词典键优先做子串替换**，
   只对显式标了 'list' 的 pattern 生效，避免污染普通整段匹配。 */
var _byLen = null;
function subDict(text) {
  if (!_byLen) {
    _byLen = Object.keys(DICT).filter(function (k) { return /[一-鿿]/.test(k); });
    _byLen.sort(function (a, b) { return b.length - a.length; });
  }
  var out = text, hit = false;
  for (var i = 0; i < _byLen.length; i++) {
    var k = _byLen[i];
    if (out.indexOf(k) >= 0) { out = out.split(k).join(DICT[k]); hit = true; }
  }
  // 中文顿号在英文里应当是逗号。词典逐项替换完还留着「、」的话，
  // 出来就是 `honeypot check、LP lock status` 这种中英混排。
  if (hit) out = out.replace(/、/g, ', ');
  return hit ? out : null;
}

/* 「正文（补充）」「正文 —— 补充」「正文：补充」三种拼接形式 */
/* 拆分「拼装句」的形态。顺序即优先级。
   半角括号那一条是后加的：Python 的结论生成器会把全角（）转成半角 ( )，
   只认全角的话 `Bundled at launch: 33.2% (同一批钱包分仓砸盘)` 永远拆不开。
   半角括号在英文里很常见，按理有误伤风险 —— 但上面那道「含中文的一半必须
   真能翻，否则不拆」的保护仍然生效，所以纯英文的括号不会被动。 */
var COMBO = [/^(.+?)（(.+?)）$/, /^(.+?)\s+——\s+(.+)$/, /^(.+?)：\s*(.+)$/,
             /^(.+?)\s+\((.+?)\)$/];

function translate(text, depth) {
  depth = depth || 0;
  if (current === 'zh') return null;
  var t = String(text);
  var trimmed = t.trim();

  /* 只由中文标点组成的文本节点要单独处理。
     起因：`<b>Alpha 催化剂</b>。</p>` 里那个句号是**标签外面的独立文本节点**，
     内容只有「。」。而下面那道判断问的是「有没有汉字」，而「。」(U+3002)
     不在 一-鿿 区间，于是直接被跳过 —— 英文界面里就留下 `Alpha catalyst。`。
     这个形态（标点写在标签外）以后还会出现，所以修在这一层而不是改 HTML。 */
  if (trimmed && !/[一-鿿]/.test(trimmed) && /^[。，、；：！？（）【】《》…—]+$/.test(trimmed)) {
    var mapped = trimmed.replace(/[。，、；：！？（）【】《》…—]/g, function (c) {
      return { '。': '.', '，': ',', '、': ',', '；': ';', '：': ':', '！': '!',
        '？': '?', '（': '(', '）': ')', '【': '[', '】': ']',
        '《': '"', '》': '"', '…': '…', '—': '—' }[c] || c;
    });
    return t.replace(trimmed, mapped);
  }

  if (!trimmed || !/[一-鿿]/.test(trimmed)) return null;
  if (DICT[trimmed]) return t.replace(trimmed, DICT[trimmed]);

  // 列表项常带前导分隔符（"· 3小时前"），剥掉再匹配、翻完贴回去
  var lead = '';
  var core = trimmed;
  // 前导分隔符要连着一起剥干净，两点：
  //   · 可能连写（结论里的「—— 」是两个 em dash），所以用 +
  //   · **可能是 emoji**（风险行是「🔴 捆绑开盘占比 …」）—— 不剥的话 core 带着
  //     🔴 前缀，永远查不到词典。这条漏了很久，风险段一直是中文。
  var lm = trimmed.match(
    /^((?:[·•\-—|]|[\u{1F300}-\u{1FAFF}]|[\u{2600}-\u{27BF}]|\u{FE0F})+\s*)(.+)$/u);
  if (lm) { lead = lm[1]; core = lm[2]; }
  if (lead && DICT[core]) return t.replace(trimmed, lead + DICT[core]);

  /* 组合形式要在 PATTERNS **之前**试一次 —— 因为像 `^捆绑开盘占比 (.+)$` 这种
     pattern 的 (.+) 会贪婪吃掉后面的「（补充说明）」，匹配成功后就轮不到回退了，
     结果是前半截翻了、括号里还是中文。
     但只在**两半都能翻**时才拆：这是「确实是拼起来的」的强信号。
     否则会误伤 `前排地址（Top 70 买入者）` 这类本身就是完整词条的。 */
  for (var ci = 0; depth < 2 && ci < COMBO.length; ci++) {
    var em = core.match(COMBO[ci]);
    if (!em) continue;
    /* 一侧本来就没有中文时，它已经是英文了，应当原样保留而不是判成「翻不动」。
       起因：Python 的结论生成器只本地化「骨架」，技能的 verdict / signal 是原样
       内插的中文，于是每行长成「**Catalyst 80** — 在 Binance Alpha 名单内」——
       左半没中文 → translate 返回 null → 整行拒绝拆分 → 右半永远翻不到。
       放开这一处，一整批「英文骨架 + 中文内容」的行就都能翻了。
       保护仍在：含中文的那一半必须真能翻，否则不拆 —— 所以
       `前排地址（Top 70 买入者）` 这类本身就是完整词条的不会被误伤。 */
    var hasCjk = function (x) { return /[一-鿿]/.test(x); };
    var ea = hasCjk(em[1]) ? translate(em[1], depth + 1) : em[1];
    var eb = hasCjk(em[2]) ? translate(em[2], depth + 1) : em[2];
    if (ea === null || eb === null) continue;
    return t.replace(trimmed, lead + (ci === 0 ? ea + ' (' + eb + ')'
      : ci === 1 ? ea + ' — ' + eb : ea + ': ' + eb));
  }

  for (var i = 0; i < PATTERNS.length; i++) {
    var m = core.match(PATTERNS[i][0]);
    if (m) {
      // 捕获组里可能还是中文（"Listed on Alpha 17.7 小时前"），递归翻一次再回填
      var listy = PATTERNS[i][2] === 'list';
      var out = PATTERNS[i][1].replace(/\$(\d)/g, function (_, n) {
        var g = m[+n];
        if (g == null) return '';
        if (depth < 2 && /[一-鿿]/.test(g)) {
          var sub = translate(g, depth + 1);
          if (sub !== null) return sub;
          // 整段翻不动就退一步：按词典键逐个替换（只对 list 型 pattern）
          if (listy) { var ls = subDict(g); if (ls !== null) return ls; }
        }
        return g;
      });
      return t.replace(trimmed, lead + out);
    }
  }
  // 组合形式的回退：结论 markdown 会把「信号正文（补充说明）」拼成一条，
  // 整段当然查不到，但两半各自都在词典里。拆开翻完再拼回去。
  // —— 也覆盖「正文 —— 补充」这种破折号分隔。
  if (depth < 2) {
    for (var c = 0; c < COMBO.length; c++) {
      var cm = core.match(COMBO[c]);
      if (!cm) continue;
      var a = translate(cm[1], depth + 1);
      var b = translate(cm[2], depth + 1);
      if (a === null && b === null) continue;
      var L = (a === null ? cm[1] : a), R = (b === null ? cm[2] : b);
      var joined = c === 0 ? L + ' (' + R + ')'
                 : c === 1 ? L + ' — ' + R
                 : L + ': ' + R;
      return t.replace(trimmed, lead + joined);
    }
  }
  if (debug) missing[trimmed] = (missing[trimmed] || 0) + 1;
  return null;
}

function walk(root) {
  if (current === 'zh' || !root) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var nodes = [], n;
  while ((n = w.nextNode())) nodes.push(n);
  nodes.forEach(function (node) {
    if (node.parentNode && /^(SCRIPT|STYLE|CODE|PRE)$/.test(node.parentNode.nodeName)) return;
    var out = translate(node.nodeValue);
    if (out !== null) {
      if (!node.__zh) node.__zh = node.nodeValue;
      node.nodeValue = out;
    }
  });
  var els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label],[alt]') : [];
  Array.prototype.forEach.call(els, function (el) {
    // 兜底：单个元素/属性出问题不能再次拖垮整轮遍历（就是上面那个 bug 的教训）
    try { translateAttrs(el); } catch (e) {}
  });
}

function translateAttrs(el) {
  ATTRS.forEach(function (a) {
      var v = el.getAttribute && el.getAttribute(a);
      if (!v) return;
      var out = translate(v);
      if (out !== null) {
        var bk = bakKey(a);
        if (!el.dataset[bk]) el.dataset[bk] = v;
        el.setAttribute(a, out);
      }
  });
}

/* dataset 的 key 不能含连字符：'zh' + 'aria-label' 会得到 dataset['zharia-label']，
   浏览器直接抛 SyntaxError。这一抛把整个属性遍历打断，后果是页面**半截翻译** ——
   chips、输入框 placeholder 全留在中文。改成统一走 camelCase。 */
function bakKey(attr) {
  return 'zh' + attr.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); })
                    .replace(/^([a-z])/, function (_, c) { return c.toUpperCase(); });
}

function restore(root) {
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var n;
  while ((n = w.nextNode())) if (n.__zh) { n.nodeValue = n.__zh; delete n.__zh; }
  Array.prototype.forEach.call(root.querySelectorAll('*'), function (el) {
    ATTRS.forEach(function (a) {
      var k = bakKey(a);
      if (el.dataset && el.dataset[k]) { el.setAttribute(a, el.dataset[k]); delete el.dataset[k]; }
    });
  });
}

/* 环境推断出来的语言不落盘，用户点过按钮才算数 */
function forget() {
  try { localStorage.removeItem('memex-lang'); } catch (e) {}
}

/* <title> 在 <head> 里，而 walk() 遍历的是 document.body —— 它永远碰不到标题。
   结果是切成英文后浏览器标签页仍显示中文（英文版截图里发现的）。单独处理。 */
var titleZh = null;
function syncTitle() {
  if (titleZh === null) titleZh = document.title;
  if (current === 'zh') { document.title = titleZh; return; }
  var out = DICT[titleZh.trim()];
  if (out) document.title = out;
}

function setLang(lang) {
  var next = lang === 'en' ? 'en' : 'zh';
  if (next === current) return;
  if (next === 'zh') { current = 'zh'; restore(document.body); }
  else { current = 'en'; walk(document.body); }
  syncTitle();
  document.documentElement.setAttribute('lang', LANGS[current]);
  try { localStorage.setItem('memex-lang', current); } catch (e) {}
  var b = document.getElementById('lang-btn');
  if (b) {
    b.textContent = current === 'en' ? '中' : 'EN';
    b.title = current === 'en' ? '切换到中文' : 'Switch to English';
  }
  if (window.parent !== window) {
    try { window.parent.postMessage({ type: 'memex-agent:lang', lang: current }, '*'); }
    catch (e) {}
  }
  // 广播出去 —— 结论那段长文是在**源头**按语言生成的（长句子没法靠 DOM 词典翻），
  // 所以切语言时 app.js 得把整段换掉，不能指望这一层。
  try { document.dispatchEvent(new CustomEvent('memex:lang', { detail: { lang: current } })); }
  catch (e) {}
}

/* 新渲染出来的节点（卡片、流式文本）也要过一遍。
   ⚠️ 必须节流：结论是打字机效果，每 16ms 就把 .md 整段 innerHTML 重写一次，
   如果每次都全子树遍历，几百次下来会把渲染线程堵死（实测直接卡住）。
   所以把待处理节点攒起来，用 rAF + 120ms 去抖批量跑，并对同一节点去重。 */
var pending = new Set();
var scheduled = 0;

function flush() {
  scheduled = 0;
  if (current === 'zh' || !pending.size) { pending.clear(); return; }
  var batch = Array.from(pending);
  pending.clear();
  // 只处理仍在文档里、且没有祖先也在本批次中的节点，避免重复遍历
  batch.forEach(function (n) {
    if (!n.isConnected) return;
    for (var i = 0; i < batch.length; i++) {
      if (batch[i] !== n && batch[i].nodeType === 1 && batch[i].contains(n)) return;
    }
    if (n.nodeType === 1) walk(n);
    else if (n.nodeType === 3) {
      var out = translate(n.nodeValue);
      if (out !== null) { if (!n.__zh) n.__zh = n.nodeValue; n.nodeValue = out; }
    }
  });
}

function schedule() {
  if (scheduled) return;
  // 不能套 requestAnimationFrame —— 页面在后台标签页时 rAF 不触发，
  // 动态卡片就永远不会被翻译（踩过）。直接在 timeout 里跑。
  scheduled = setTimeout(flush, 120);
}

var mo = new MutationObserver(function (recs) {
  if (current === 'zh') return;
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i];
    for (var j = 0; j < r.addedNodes.length; j++) {
      var n = r.addedNodes[j];
      if (n.nodeType === 1 || n.nodeType === 3) pending.add(n);
    }
    if (r.type === 'characterData' && r.target) pending.add(r.target);
  }
  if (pending.size) schedule();
});

/* 初始语言的判定顺序 —— 越靠前越"明确表达过意愿"：
     1. URL ?lang=        扩展会把宿主页面的语言带进来
     2. localStorage      用户上次手动切过
     3. <html lang>       页面自己声明的语言（嵌在别人页面里时最准）
     4. navigator.languages  浏览器偏好列表，按顺序找第一个能识别的
     5. 兜底 zh
   只有 1、2 是"用户意愿"，3、4 属于环境推断，所以不写回 localStorage，
   避免把一次偶然的环境判断固化成永久选择。 */
function detectLang() {
  var q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'zh') return { lang: q, explicit: true };
  var saved = null;
  try { saved = localStorage.getItem('memex-lang'); } catch (e) {}
  if (saved === 'en' || saved === 'zh') return { lang: saved, explicit: true };

  var docLang = (document.documentElement.getAttribute('lang') || '').toLowerCase();
  if (docLang) {
    if (docLang.indexOf('zh') === 0) return { lang: 'zh', explicit: false };
    if (/^[a-z]{2}/.test(docLang)) return { lang: 'en', explicit: false };
  }
  var list = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || ''];
  for (var i = 0; i < list.length; i++) {
    var L = String(list[i] || '').toLowerCase();
    if (L.indexOf('zh') === 0) return { lang: 'zh', explicit: false };
    if (/^[a-z]{2}/.test(L)) return { lang: 'en', explicit: false };
  }
  return { lang: 'zh', explicit: false };
}

function init() {
  var det = detectLang();
  var want = det.lang;
  document.documentElement.setAttribute('lang', LANGS[want === 'en' ? 'en' : 'zh']);
  mo.observe(document.body, { childList: true, subtree: true, characterData: true });
  if (want === 'en') { setLang('en'); if (!det.explicit) forget(); }
  var b = document.getElementById('lang-btn');
  if (b) {
    b.textContent = current === 'en' ? '中' : 'EN';
    b.onclick = function () { setLang(current === 'en' ? 'zh' : 'en'); };
  }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || e.source === window) return;
    if ((e.data || {}).type === 'memex-agent:setlang') setLang(e.data.lang);
  });
}

global.I18N = {
  init: init, setLang: setLang,
  get lang() { return current; },
  missing: function () { return missing; },
  coverage: function () {
    return { dict: Object.keys(DICT).length, patterns: PATTERNS.length,
             missing: Object.keys(missing).length };
  }
};
})(window);

</script>
<script>
/* 轻量蜡烛图 —— 无依赖 canvas 实现
   支持：K 线 / 成交量 / EMA9·EMA21 / 十字光标 / 入场揭示动画 / DPR 自适应 */
(function (global) {
  'use strict';

  /* 颜色从 CSS 变量读，这样换主题不用改 JS —— 浅色下网格线和轴标必须变浅，
     否则一条深灰在白底上非常脏。 */
  function tok(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  function palette() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    return {
      up: tok('--green', '#4fbe87'),
      down: tok('--red', '#e5605f'),
      grid: tok('--divider', light ? '#e7e8ea' : '#25272a'),
      axis: tok('--t4', light ? '#a2a8af' : '#565b61'),
      ema9: tok('--yellow', '#e8b04b'),
      ema21: tok('--purple', '#b57df0'),
      upFill: light ? 'rgba(18,133,90,.26)' : 'rgba(79,190,135,.30)',
      downFill: light ? 'rgba(192,57,47,.24)' : 'rgba(229,96,95,.30)',
      crosshair: light ? 'rgba(16,17,19,.34)' : 'rgba(242,243,244,.30)',
      tagText: light ? '#ffffff' : '#0f1011'
    };
  }

  function fmtNum(v) {
    var a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (a >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (a >= 1e3) return (v / 1e3).toFixed(2) + 'K';
    if (a >= 1) return v.toFixed(2);
    if (a === 0) return '0';
    return v.toPrecision(4);
  }

  function fmtTime(ms) {
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' +
           p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function Candles(canvas, tip) {
    this.canvas = canvas;
    this.tip = tip || null;
    this.ctx = canvas.getContext('2d');
    this.data = null;
    this.hover = -1;
    this.reveal = 0;
    this._raf = null;
    this._bind();
  }

  Candles.prototype._bind = function () {
    var self = this;
    this._onResize = function () { self.draw(); };
    global.addEventListener('resize', this._onResize);

    this.canvas.addEventListener('mousemove', function (e) {
      if (!self.data) return;
      var r = self.canvas.getBoundingClientRect();
      var x = e.clientX - r.left;
      var g = self._geom(r.width, r.height);
      var i = Math.round((x - g.left - g.cw / 2) / g.step);
      i = Math.max(0, Math.min(self.data.candles.length - 1, i));
      if (i !== self.hover) { self.hover = i; self.draw(); }
      self._showTip(e, r, g, i);
    });
    this.canvas.addEventListener('mouseleave', function () {
      self.hover = -1;
      if (self.tip) self.tip.classList.remove('on');
      self.draw();
    });
  };

  Candles.prototype.destroy = function () {
    global.removeEventListener('resize', this._onResize);
    if (this._raf) cancelAnimationFrame(this._raf);
  };

  Candles.prototype.setData = function (d) {
    this.data = d && d.candles && d.candles.length ? d : null;
    this.reveal = 0;
    this._animate();
  };

  Candles.prototype._animate = function () {
    var self = this;
    var t0 = performance.now();
    if (this._raf) cancelAnimationFrame(this._raf);
    var step = function (t) {
      var k = Math.min(1, (t - t0) / 520);
      self.reveal = 1 - Math.pow(1 - k, 3);   // easeOutCubic
      self.draw();
      if (k < 1) self._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  };

  Candles.prototype._geom = function (w, h) {
    var left = 6, right = 54, top = 8, volH = Math.round(h * 0.20), gap = 10;
    var n = this.data.candles.length;
    var plotW = w - left - right;
    var step = plotW / n;
    return {
      left: left, right: right, top: top, w: w, h: h,
      priceH: h - top - volH - gap, volTop: h - volH, volH: volH,
      step: step, cw: Math.max(1, Math.min(11, step * 0.66)), plotW: plotW
    };
  };

  Candles.prototype.draw = function () {
    var cv = this.canvas, ctx = this.ctx;
    var rect = cv.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    if (!w || !h) return;
    var dpr = global.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!this.data) return;

    var C = this.data.candles, g = this._geom(w, h), P = palette();

  if (sniperHold > 0.1) { score -= 20; S.push(sig('bad', `狙击盘仍持 ${pct(sniperHold, 1)}`)); }
  else if (sniperHold > 0.02) { score -= 8; S.push(sig('warn', `狙击盘持有 ${pct(sniperHold, 2)}`)); }

  if (smartPos.length) {
    const head = smartPos.filter((p) => p <= 20);
    score += Math.min(18, smartPos.length * 2);
    const detail = [];
    if (head.length) detail.push(`${head.length} 个挤在前 20`);
    if (smartHold + smartMore) detail.push(`其中 ${smartHold + smartMore} 个还没走`);
    else if (smartSold) detail.push(`但 ${smartSold} 个已清仓`);
    S.push(sig(smartHold + smartMore ? 'good' : 'info',
      `${smartPos.length} 个聪明钱/KOL 抢到前排（名次 ${smartPos.slice(0, 8).join(', ')}${smartPos.length > 8 ? ' …' : ''}）`,
      detail.join('，') || null));
    if (smartSold && !(smartHold + smartMore)) score -= 8;
  }

  const tagCount = {}, rows = [], smartSet = new Set(smartPos);
  infos.forEach((h, i) => {
    const tags = tagsOf(h);
    tags.forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; });
    rows.push({ rank: i + 1, address: h.wallet_address, status: h.status,
      status_label: STATUS_LABEL[h.status] || h.status, tags,
      tag_labels: tags.map((t) => TAG_TEXT[t] || t),
      smart: smartSet.has(i + 1), risky: tags.some((t) => RISK_TAGS.includes(t)) });
  });
  for (const [tag, pen] of [['sniper', 8], ['bundler', 10], ['rat_trader', 12], ['sandwich_bot', 6]]) {
    const n = tagCount[tag] || 0;
    if (n > total * 0.2) { score -= pen; S.push(sig('warn', `前排里 ${n}/${total} 个是${TAG_TEXT[tag] || tag}`)); }
  }
  if ((tagCount.fresh_wallet || 0) > total * 0.3)
    S.push(sig('info', `前排里 ${tagCount.fresh_wallet} 个是当时的新钱包`, '典型的开盘女巫/多开'));

  const M = [
    metric('仍持有', `${stillIn} / ${total}`, stillIn / total > 0.3 ? 'bad' : 'good'),
    metric('已清仓', String(sold), 'good'),
    metric('部分卖出', String(part)),
    metric('转出', String(trans), trans > 10 ? 'warn' : 'neutral'),
    metric('加仓', String(more), more ? 'good' : 'neutral'),
    metric('前排现持仓占比', pct(holdingRate, 3), holdingRate > 0.1 ? 'bad' : 'good')
  ];
  score = clamp(score);
  const verdict = holdingRate > 0.15 ? '前排悬顶，抛压未释放'
    : more > 2 ? '前排回补，早期玩家看多'
    : exitRate > 0.85 ? '前排已出清，抛压干净' : '前排换手进行中';
  return { id: 'early_buyers', title: `前排地址（Top ${total} 买入者）`,
    score: Math.round(score), verdict, signals: S, metrics: M,
    data: { rows, status: { hold, bought_more: more, sold_part: part, sold, transfered: trans },
      tag_count: Object.entries(tagCount).sort((a, b) => b[1] - a[1])
        .map(([tag, count]) => ({ tag, label: TAG_TEXT[tag] || tag, count })),
      smart_pos: smartPos } };
}

/* ══════════ Skill 4 · K 线形态 ══════════ */
const ema = (vals, n) => {
  if (!vals.length) return [];
  const k = 2 / (n + 1), out = [vals[0]];
  for (let i = 1; i < vals.length; i++) out.push(vals[i] * k + out[i - 1] * (1 - k));
  return out;
};
function atrPct(rows, n = 14) {
  if (rows.length < 2) return 0;
  const trs = [];
  for (let i = 1; i < rows.length; i++) {
    const { high: h, low: l } = rows[i], pc = rows[i - 1].close;
    trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  const seg = trs.slice(-n);
  return seg.length ? (seg.reduce((a, b) => a + b, 0) / seg.length) / (rows.at(-1).close || 1) : 0;
}
function slopePct(closes, n = 20) {
  const seg = closes.slice(-n);
  if (seg.length < 3) return 0;
  const m = seg.length, xbar = (m - 1) / 2, ybar = seg.reduce((a, b) => a + b, 0) / m;
  let numr = 0, den = 0;
  seg.forEach((v, i) => { numr += (i - xbar) * (v - ybar); den += (i - xbar) ** 2; });
  return (numr / (den || 1)) * m / (ybar || 1);
}
function classifyPattern(slope, dd, atr, up, volRatio, upFromLow) {
  if (slope > 0.25 && dd < 0.12) return '单边拉升';
  if (slope > 0.08 && dd < 0.25) return '上升通道';
  if (dd > 0.55 && slope < -0.1) return '破位下跌';
  if (dd > 0.35 && Math.abs(slope) < 0.08) return '高位派发/横盘';
  if (slope < -0.2) return '阴跌趋势';
  if (Math.abs(slope) < 0.05 && atr < 0.05 && upFromLow < 0.2) return '底部横盘';
  if (Math.abs(slope) < 0.08 && atr > 0.08) return '宽幅震荡';
  return up ? '多头整理' : '空头整理';
}

function klineRead(kline, resolution, historyHigh) {
  kline = kline || {}; resolution = resolution || '15m'; historyHigh = historyHigh || 0;
  const unit = kline.unit || 'price';
  const rows = (kline.list || []).map((r) => ({
    t: Math.round(f(r.time)), open: f(r.open), high: f(r.high),
    low: f(r.low), close: f(r.close), volume: f(r.volume)
  })).filter((r) => r.close > 0);

  if (rows.length < 8)
    return { id: 'kline', title: 'K 线形态', score: 50, verdict: 'K 线数据不足，无法判形态',
      signals: [], metrics: [], data: { candles: rows, unit, resolution } };

  const closes = rows.map((r) => r.close), vols = rows.map((r) => r.volume);
  const last = rows.at(-1);
  const e9 = ema(closes, 9), e21 = ema(closes, 21);
  const slope = slopePct(closes, 20), atr = atrPct(rows);
  const winHigh = Math.max(...rows.map((r) => r.high));
  const winLow = Math.min(...rows.map((r) => r.low));
  const dd = winHigh ? (winHigh - last.close) / winHigh : 0;
  const upFromLow = winLow ? (last.close - winLow) / winLow : 0;
  const prevVols = vols.slice(-21, -1);
  const smaV = prevVols.length ? prevVols.reduce((a, b) => a + b, 0) / prevVols.length : 0;
  const volRatio = smaV ? vols.at(-1) / smaV : 1;

  let greens = 0, reds = 0;
  for (let i = rows.length - 1; i >= 0 && rows[i].close >= rows[i].open; i--) greens++;
  for (let i = rows.length - 1; i >= 0 && rows[i].close < rows[i].open; i--) reds++;

  const S = [], M = []; let score = 50;
  const trendUp = e9.at(-1) > e21.at(-1);
  const crossed = e9.length > 2 && ((e9.at(-2) <= e21.at(-2)) !== (e9.at(-1) <= e21.at(-1)));
  if (trendUp) { score += 12; S.push(sig('good', 'EMA9 在 EMA21 上方，短期多头结构')); }
  else { score -= 12; S.push(sig('bad', 'EMA9 跌破 EMA21，短期空头结构')); }
  if (crossed) S.push(sig('info', `刚发生均线${trendUp ? '金' : '死'}叉`, '形态转折点，注意假突破'));

  if (slope > 0.15) { score += 15; S.push(sig('good', `近 20 根单边上行，斜率 +${(slope * 100).toFixed(0)}%`)); }
  else if (slope > 0.02) { score += 6; S.push(sig('good', `温和上行 +${(slope * 100).toFixed(1)}%`)); }
  else if (slope < -0.15) { score -= 15; S.push(sig('bad', `近 20 根单边下行 ${(slope * 100).toFixed(0)}%`)); }
  else if (slope < -0.02) { score -= 6; S.push(sig('warn', `缓慢阴跌 ${(slope * 100).toFixed(1)}%`)); }
  else S.push(sig('info', '横盘震荡，方向未定'));

  const lastUp = last.close >= last.open;
  if (volRatio > 3) {
    S.push(sig(lastUp ? 'good' : 'bad', `最新一根放量 ${volRatio.toFixed(1)}x`,
      lastUp ? '放量拉升' : '放量下砸'));
    score += lastUp ? 8 : -10;
  } else if (volRatio < 0.3) { score -= 5; S.push(sig('warn', `成交量萎缩至均量 ${(volRatio * 100).toFixed(0)}%`, '关注度流失')); }

  if (dd > 0.6) { score -= 15; S.push(sig('bad', `较区间高点回撤 ${(dd * 100).toFixed(0)}%`, '接飞刀风险')); }
  else if (dd > 0.3) { score -= 6; S.push(sig('warn', `较区间高点回撤 ${(dd * 100).toFixed(0)}%`)); }
  else if (dd < 0.05) { score += 8; S.push(sig('good', '贴着区间高点运行')); }

  if (atr > 0.15) S.push(sig('warn', `波动率极高 ATR ${(atr * 100).toFixed(1)}%`, '仓位要砍半'));
  else if (atr < 0.02) S.push(sig('info', `波动率低 ATR ${(atr * 100).toFixed(1)}%`));
  if (greens >= 5) S.push(sig('warn', `连续 ${greens} 根阳线`, '短线超买，追高谨慎'));
  if (reds >= 5) S.push(sig('warn', `连续 ${reds} 根阴线`, '下跌趋势未止跌'));

  if (closes.length > 40) {
    const pNow = Math.max(...closes.slice(-20)), pPrev = Math.max(...closes.slice(-40, -20));
    const vNow = vols.slice(-20).reduce((a, b) => a + b, 0) / 20;
    const vPrev = vols.slice(-40, -20).reduce((a, b) => a + b, 0) / 20;
    if (pNow > pPrev * 1.02 && vPrev && vNow < vPrev * 0.7) {
      score -= 10; S.push(sig('bad', '量价背离：价格新高但成交量萎缩', '上涨缺乏承接'));
    }
  }
  if (historyHigh && unit === 'mcap' && historyHigh > 0) {
    const ratio = last.close / historyHigh;
    M.push(metric('距历史最高市值', `${(ratio * 100).toFixed(0)}%`,
      ratio > 0.8 ? 'good' : ratio > 0.4 ? 'warn' : 'bad'));
    if (ratio < 0.2) S.push(sig('bad', `仅剩历史最高市值的 ${(ratio * 100).toFixed(0)}%`, '已破位，大概率凉盘'));
  }

  const pattern = classifyPattern(slope, dd, atr, trendUp, volRatio, upFromLow);
  M.unshift(metric('形态', pattern));
  M.push(metric('斜率(20根)', `${slope >= 0 ? '+' : ''}${(slope * 100).toFixed(1)}%`, slope > 0 ? 'good' : 'bad'));
  M.push(metric('波动率 ATR', `${(atr * 100).toFixed(1)}%`, atr > 0.1 ? 'warn' : 'neutral'));
  M.push(metric('量比', `${volRatio.toFixed(2)}x`, volRatio > 1.5 ? 'good' : 'neutral'));
  M.push(metric('区间回撤', `${(dd * 100).toFixed(0)}%`, dd > 0.4 ? 'bad' : 'good'));

  return { id: 'kline', title: 'K 线形态', score: Math.round(clamp(score)), verdict: pattern,
    signals: S, metrics: M,
    data: { candles: rows, unit, resolution, ema9: e9, ema21: e21,
      support: winLow, resistance: winHigh, pattern } };
}

/* ══════════ Skill 5 · X 叙事 & 讨论度 ══════════
 * 四路信息合流，任何一路失败都降级而不是报错：
 *   · sourceTweet 行情源 twitter 字段常直接指向首发叙事推文
 *   · project     项目方时间线
 *   · scan        打狗 KOL 池 + 自动发现名单的提及
 *   · searchRes   搜索引擎搜 CA/$符号 拿到的全网讨论
 *   · web2Res     推文外链里的站外叙事源
 * 两条硬规则：只有 24h 窗口内的提及参与计分；每条提及必须有硬凭据。
 */
const eng = (m) => f(m.likes) + f(m.retweets) * 2 + f(m.replies);
const HARD_MATCH = ['ca', 'cashtag'];

function xNarrative({ project, scan, searchRes, web2Res, symbol, name,
  sourceTweet, narratives = [] } = {} = {}) {
  const S = [], M = [];
  let score = 35;
  const now = Date.now() / 1000;
  scan = scan || {}; searchRes = searchRes || {}; web2Res = web2Res || {};

  const rawMentions = scan.hits || [];
  const covered = scan.covered || 0, totalKol = scan.total || 0;
  const rawWeb = searchRes.tweets || [];
  const historical = [...(scan.historical || []), ...(searchRes.historical || [])];
  const windowH = Math.round((scan.window || 86400) / 3600);

  // 搜索结果里的 name 档是拿币名主动搜回来的 → 算数；
  // 时间线扫描里的 context 档是撞上的 → 只当疑似，不计分。
  const hard = [...rawMentions, ...rawWeb].filter((m) => HARD_MATCH.includes(m.match));
  const soft = rawMentions.filter((m) => m.match === 'context');
  const mentions = rawMentions.filter((m) => HARD_MATCH.includes(m.match));
  const webTweets = rawWeb.filter((m) => [...HARD_MATCH, 'name'].includes(m.match));
  const byName = rawWeb.filter((m) => m.match === 'name');

  const kolHits = mentions.filter((m) => m.kol);
  const otherHits = mentions.filter((m) => !m.kol);
  const webKolHits = webTweets.filter((t) => t.kol);

  const texts = [];
  if (sourceTweet) texts.push(sourceTweet.text || '');
  if (project) texts.push(...(project.latest || []).map((t) => t.text));
  texts.push(...mentions.slice(0, 40).map((m) => m.text));
  texts.push(...webTweets.slice(0, 20).map((t) => t.text));
  for (const x of [name, symbol]) if (x) texts.push(x);

  /* — 叙事源推 — */
  if (sourceTweet) {
    const e = eng(sourceTweet);
    S.push(sig('info', `叙事源推：@${sourceTweet.handle || '?'}`, (sourceTweet.text || '').slice(0, 120)));
    if (e > 500) { score += 12; S.push(sig('good', `源推互动 ${num(e)}`)); }
    else if (e < 30) { score -= 6; S.push(sig('warn', `源推互动仅 ${e}`, '叙事没起来')); }
  }

  /* — 项目方 — */
  if (project) {
    const fol = project.followers || 0, p7 = project.posts_7d || 0;
    M.push(metric('项目方粉丝', num(fol), fol > 20000 ? 'good' : fol < 1000 ? 'warn' : 'neutral'));
    M.push(metric('近 7 天发推', String(p7), p7 >= 3 ? 'good' : 'warn'));
    if (fol > 100000) { score += 22; S.push(sig('good', `项目方 ${num(fol)} 粉丝，量级罕见`)); }
    else if (fol > 10000) { score += 13; S.push(sig('good', `项目方 ${num(fol)} 粉丝`)); }
    else if (fol < 500) { score -= 8; S.push(sig('warn', `项目方仅 ${fol} 粉丝`, '冷启动阶段')); }
    if (project.partial) S.push(sig('info', '项目方时间线不可读，仅拿到单条源推', '该账号可能未开放嵌入，或正处于 X 限流冷却'));
    else if (p7 === 0) { score -= 10; S.push(sig('bad', '项目方 7 天没发推', '运营停摆')); }
    else if (p7 >= 10) { score += 7; S.push(sig('good', `项目方 7 天发了 ${p7} 条，运营活跃`)); }
  } else {
    score -= 6;
    S.push(sig('warn', '没抓到项目方 X 账号', '行情源的 twitter 字段可能指向一条推文而非账号主页'));
  }

  /* — 打狗 KOL（权重最高：链上实盘验证过的人在聊）— */
  const kolAll = {};
  for (const m of [...kolHits, ...webKolHits]) {
    const h = m.handle; if (!h) continue;
    const e = kolAll[h] || (kolAll[h] = { handle: h, author: m.author, avatar: m.avatar,
      count: 0, engagement: 0, hard: false, evidence: null, age_sec: null,
      followers: m.followers || 0, profit: (m.kol || {}).profit || 0,
      tags: (m.kol || {}).tags || [] });
    e.count++; e.engagement += eng(m);
    if (HARD_MATCH.includes(m.match)) e.hard = true;

  const kolHard = kolList.filter((k) => k.hard);

  const uniqIds = new Set([...mentions, ...webTweets].map((m) => m.id));
  M.unshift(metric(`热点提及 ${windowH}h`, `${uniqIds.size} 条`,

  if (kolProfitSum) M.push(metric('这些 KOL 累计盈利', usd(kolProfitSum), 'good'));

    score += 30;

      `他们累计已实现盈利 ${usd(kolProfitSum)} —— 这批人下场通常意味着有共识`));
  } else if (kolList.length >= 2) {
    score += 20;
    S.push(sig('good', `${kolList.length} 个打狗 KOL 提及（${kolList.slice(0, 3).map((k) => '@' + k.handle).join('、')}）`,

  if (webTweets.length) {
    M.push(metric('全网搜到讨论', String(webTweets.length), 'good'));
    M.push(metric('讨论总互动', num(webEng)));
    if (webTweets.length >= 8) {
      score += 16;
      S.push(sig('good', `全网搜到 ${webTweets.length} 条讨论，合计互动 ${num(webEng)}`, '叙事已经扩散到 KOL 池之外'));
    } else { score += 8; S.push(sig('good', `全网搜到 ${webTweets.length} 条讨论`)); }
    const distinct = new Set(webTweets.map((t) => t.handle).filter(Boolean)).size;
    if (distinct >= 6) { score += 6; S.push(sig('good', `${distinct} 个不同账号在讨论`, '不是单点刷屏')); }
    else if (distinct === 1 && webTweets.length > 2) { score -= 5; S.push(sig('warn', '全部来自同一个账号', '疑似自导自演')); }
    if (searchRes.rejected)
      S.push(sig('info', `搜索结果里剔掉了 ${searchRes.rejected} 条不相关的`, '水化后用同一套强框定规则做了二次校验'));
  } else if (state === 'queued' || state === 'cooling') {
    S.push(sig('info', `全网搜索${state === 'queued' ? '排队中' : '限流冷却中'}`,
      '搜索引擎对脚本流量敏感，结果会在下次查询同一个 CA 时补上'));
  } else {
    // 这里必须说清楚：X 的内容早就基本不在公开搜索索引里了（X 封爬虫），
    // 搜索引擎 0 命中**不能推断成没人聊**。实测同一个 CA 在 X 站内搜索
    // 有大量讨论，但 Bing / Brave / DDG / Yandex / Mojeek 全部 0 条。

      'X 对爬虫基本封闭，搜索引擎的 0 结果**推不出「没人聊」**—— 要判断真实声量请直接在 X 站内搜索。本项只按已抓到的证据打分，不因搜不到而扣分'));
  }

  /* — 其它提及 / 时效 — */
  if (otherHits.length) M.push(metric('名单内其它提及', String(otherHits.length)));
  const allHits = [...mentions, ...webTweets];
  const freshHits = allHits.filter((m) => m.heat === 'hot');
  if (freshHits.length) { score += 12; S.push(sig('good', `近 6 小时有 ${freshHits.length} 条新提及`, '热度在升温')); }
  else if (allHits.length) {
    const newest = Math.max(...allHits.map((m) => m.ts || 0));
    if (newest) S.push(sig('info', `最新一条提及在 ${((now - newest) / 3600).toFixed(1)} 小时前`));
  }

  // 叙事高峰经常落在窗口外（「牛来」那部电影是 47 小时前爆的）。
  // 计分只认窗口内，但必须把高峰点出来，否则「热度已过」会被误读成「从没热过」。
  let peak = null, peakEng = 0;
  for (const m of historical) {
    const e = m.engagement ?? (f(m.likes) + f(m.retweets) * 2);
    if (!peak || e > peakEng) { peak = m; peakEng = e; }

  if (peak && peakEng >= 200) {
    const hrs = (now - (peak.ts || now)) / 3600;
    M.push(metric('叙事高峰', `${num(peakEng)} 互动 · ${hrs.toFixed(0)}h前`, hrs > windowH ? 'warn' : 'good'));
    S.push(sig(allHits.length ? 'info' : 'warn',

    const newestOld = Math.max(...historical.map((m) => m.ts || 0));
    S.push(sig('bad', `${windowH} 小时内零提及`,
      `有 ${historical.length} 条历史讨论，最近一条在 ${(newestOld ? (now - newestOld) / 3600 : 0).toFixed(1)} 小时前 —— 按规矩不计分`));
  } else if (historical.length) {
    S.push(sig('info', `另有 ${historical.length} 条历史提及（超出 ${windowH}h 窗口）`, '已归档，不参与打分'));
  }
  if (soft.length)
    S.push(sig('info', `另有 ${soft.length} 条疑似相关（只匹配到名称+语境词）`,
      '没贴 CA 也没带 $符号，可能只是同名词撞车 —— 已排除在计分外'));

    score += Math.min(14, 6 + w2.length * 2);
